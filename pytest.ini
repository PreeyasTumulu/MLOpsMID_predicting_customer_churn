[pytest]
testpaths = tests

# Put the repo root on sys.path so `from src...` resolves. Without this,
# pytest's default import mode only adds tests/ and every import fails.
pythonpath = .

addopts =
    -v
    --strict-markers
    --tb=short

markers =
    integration: needs the DVC-tracked datasets; auto-skipped when absent (never runs in CI)
